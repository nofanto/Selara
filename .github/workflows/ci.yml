name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a run be triggered by hand — useful for re-running a flaky suite, and for
  # proving CI works without having to push a commit to find out.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that PR's older, still-running CI run — its
# result is superseded, and the Playwright suite would otherwise keep a runner busy
# for ~13 minutes to report on a commit nobody is looking at. The group is keyed on
# this workflow and the PR number, so different PRs never share a group. Every other
# run (a push to main, a manual run) gets a group of its own via the unique run_id,
# so it can neither cancel nor be cancelled by anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast feedback: the unit tests cover the domain rules CLAUDE.md calls the primary
  # risk (RPTI/LKPTI generation, the decision-log rules, the Excel round trip), so
  # they should fail in under a minute rather than behind a 10-minute browser suite.
  verify:
    name: Unit tests, build, static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

      # Enforced: the eslint baseline was cleared on this branch, so a new error here
      # is genuinely new and should stop the build.
      - name: Lint
        run: npx eslint .

      # Ratcheted, not merely non-blocking. `continue-on-error` renders a green tick,
      # so a failing typecheck looked identical to a passing one at a glance — and a
      # check nobody can see fail is not a check. This compares the error count against
      # a known baseline instead: any error above the baseline fails the build, and
      # clearing one prompts you to lower it.
      #
      # At zero since M1 (specs/005-workspace-recovery): the one pre-existing error —
      # `sanitizeTimelineSettings(...) || {}` for a snapshot with no usable settings in
      # src/lib/excel.ts — was replaced by the documented display repair in
      # repairSnapshotSettings, not a cast.
      - name: Typecheck
        env:
          BASELINE: 0
        run: |
          LOG="$RUNNER_TEMP/tsc.log"
          npx tsc --noEmit > "$LOG" 2>&1 || true
          COUNT=$(grep -c 'error TS' "$LOG" || true)
          {
            echo "### Typecheck"
            echo
            echo "tsc --noEmit reported **$COUNT** error(s). Accepted baseline: **$BASELINE**."
            if [ -s "$LOG" ]; then
              echo
              echo '```'
              cat "$LOG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Typecheck regressed — $COUNT errors against a baseline of $BASELINE. See the run summary."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Typecheck improved — $COUNT errors against a baseline of $BASELINE. Lower BASELINE in .github/workflows/ci.yml."
          fi
          echo "Typecheck at baseline ($COUNT error(s), baseline $BASELINE)."

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Only chromium is configured in playwright.config.ts — installing the other
      # browsers would add minutes per run for projects that never execute.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
